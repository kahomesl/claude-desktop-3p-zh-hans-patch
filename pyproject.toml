[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-desktop-3p-zh-hans-patch"
dynamic = ["version"]
description = "Install a Simplified Chinese interface into a local copy of Claude Desktop (unofficial)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "claude-desktop-3p-zh-hans-patch contributors" }]
keywords = ["claude-desktop", "localization", "zh-hans", "macos", "unofficial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kahomesl/claude-desktop-3p-zh-hans-patch"
Issues = "https://github.com/kahomesl/claude-desktop-3p-zh-hans-patch/issues"

[project.scripts]
claude-zh-patch = "claude_zh_patch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "claude_zh_patch.__version__" }

[tool.setuptools.package-data]
"*" = ["py.typed"]
